[package]
name = "pilaf-substrategy"
version = "0.1.0"
edition = "2021"
description = "R51 — Pilaf layer-3 sub-strategy evolution. Rust wrapper that scores ACPrompt attention-queue items and emits suggested actions. Allowed to evolve freely without touching layer-1 (Core Identity) or layer-2 (Strategy / TS brain)."
license = "MIT"
repository = "https://github.com/ffffj-ai/pilaf-substrategy"

[lib]
name = "pilaf_substrategy"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pilaf-substrategy"
path = "src/bin/cli.rs"

# R51 feedback-tuning pass (2026-04-25): separate binary so the main
# CLI stays read-only. Operators / CI invoke this one to propose new
# weight files from recent decision outcomes.
[[bin]]
name = "pilaf-substrategy-tune"
path = "src/bin/tune.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# R142 — tests/golden.rs pins the cross-language fixture by SHA256 so a fixture
# edited in one repo fails the other repo's test. Test-only, so the published
# library gains no dependency.
[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
